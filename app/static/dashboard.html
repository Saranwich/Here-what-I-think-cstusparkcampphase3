<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>น้องเมือง — เรื่องที่ชาวบ้านเล่ามา</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f5f4f1;  --panel: #fff;  --line: #e0ddd6;
    --ink: #26241f;  --dim: #6f6a60;
    --heat: #d9534f;  --flood: #3b82c4;  --access: #b8860b;
    --lighting: #7b5ea7;  --waste: #4f8a5b;  --other: #6f6a60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", -apple-system, sans-serif;
  }
  #map { flex: 1; }
  aside {
    width: 400px; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 20px;
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--dim); margin-bottom: 18px; }
  .counts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .chip {
    font-size: 12px; padding: 3px 9px; border-radius: 99px;
    background: #eeece6; color: var(--dim);
  }
  .chip b { color: var(--ink); }
  .tallynote { flex-basis: 100%; font-size: 11px; color: var(--dim); margin-top: 2px; }
  .empty { color: var(--dim); font-size: 14px; line-height: 1.7; }

  .card { border-top: 1px solid var(--line); padding-top: 14px; }
  .cat {
    display: inline-block; font-size: 11px; color: #fff;
    padding: 2px 8px; border-radius: 3px; margin: 0 4px 8px 0;
  }
  /* หัวข้อรองของใบเดียวกัน — เห็นว่ามีอีก แต่ไม่แย่งสายตาไปจากเรื่องหลัก */
  .cat.alt { background: none; }
  .card h2 { font-size: 16px; margin: 0 0 10px; line-height: 1.4; }
  .notes { font-size: 14px; line-height: 1.75; margin-bottom: 16px; }

  dl { margin: 0; font-size: 13px; }
  dt { color: var(--dim); margin-top: 10px; }
  dd { margin: 2px 0 0; line-height: 1.6; }
  .said { border-left: 2px solid var(--line); padding-left: 9px; font-style: italic; }

  .shots { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .shot { width: 108px; }
  .shot img {
    width: 108px; height: 108px; object-fit: cover;
    border-radius: 4px; border: 1px solid var(--line); display: block;
  }
  .shot span { font-size: 11px; color: var(--dim); line-height: 1.4; display: block; margin-top: 4px; }

  .nopin { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 14px; }
  .nopin h3 { font-size: 13px; margin: 0 0 4px; }
  .nopin p { font-size: 12px; color: var(--dim); margin: 0 0 10px; line-height: 1.6; }
  .nopin li { font-size: 13px; margin-bottom: 8px; cursor: pointer; line-height: 1.5; }
  .nopin li:hover { text-decoration: underline; }
  .nopin ul { margin: 0; padding-left: 18px; }
  .where { color: var(--dim); font-size: 12px; }

  .flag { font-size: 12px; color: var(--dim); margin-top: 12px; }
</style>
</head>
<body>
<div id="map"></div>
<aside id="side">
  <h1>เรื่องที่ชาวบ้านเล่ามา</h1>
  <div class="sub" id="sub">กำลังโหลด…</div>
  <div class="counts" id="counts"></div>
  <div id="detail" class="empty">กดหมุดบนแผนที่เพื่อดูรายละเอียด</div>
  <div id="nopin"></div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CAT = {
  heat:     { name: "ความร้อน",     color: getVar("--heat") },
  flood:    { name: "น้ำท่วม",       color: getVar("--flood") },
  access:   { name: "การเข้าถึง",    color: getVar("--access") },
  lighting: { name: "ไฟส่องสว่าง",   color: getVar("--lighting") },
  waste:    { name: "ขยะ น้ำเสีย",   color: getVar("--waste") },
  other:    { name: "อื่น ๆ",        color: getVar("--other") },
};
const SEVERITY  = { low: "เล็กน้อย", medium: "ปานกลาง", high: "หนัก" };
const FREQUENCY = { once: "เกิดครั้งเดียว", occasional: "เกิดเป็นครั้งคราว", recurring: "เกิดซ้ำ ๆ" };
const TAGS = {
  health: "สุขภาพ", safety: "ความปลอดภัย", mobility: "การเดินทาง",
  property: "ทรัพย์สิน", income: "รายได้", daily_life: "ชีวิตประจำวัน",
};
const TIMES = { morning: "เช้า", afternoon: "บ่าย", evening: "เย็น", night: "กลางคืน" };

function getVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function cat(c) { return CAT[c] || CAT.other; }
// หนึ่งใบติดได้หลายหัวข้อ ตัวแรกคือเรื่องหลัก — หมุดมีสีเดียว ต้องมีกฎว่าใครได้สี
function cats(r) { return (r.categories || []).length ? r.categories : ["other"]; }
function main(r) { return cats(r)[0]; }
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));
}

const map = L.map("map").setView([13.7563, 100.5018], 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap", maxZoom: 19,
}).addTo(map);

const marks = {};

fetch("/api/dashboard/reports")
  .then(r => r.json())
  .then(draw)
  .catch(e => {
    document.getElementById("sub").textContent = "ต่อกับเซิร์ฟเวอร์ไม่ได้";
    console.error(e);
  });

function draw(reports) {
  const pinned = reports.filter(r => r.latitude != null && r.longitude != null);
  const loose  = reports.filter(r => r.latitude == null || r.longitude == null);

  document.getElementById("sub").textContent =
    `${reports.length} เรื่อง · ปักหมุดได้ ${pinned.length} · ยังไม่มีหมุด ${loose.length}`;

  // หนึ่งใบนับได้หลายหัวข้อ **ผลรวมจึงเกินจำนวนใบได้ ไม่ใช่บั๊ก** มีคำกำกับใต้ป้าย
  const tally = {};
  reports.forEach(r => cats(r).forEach(c => tally[c] = (tally[c] || 0) + 1));
  document.getElementById("counts").innerHTML = Object.entries(tally)
    .sort((a, b) => b[1] - a[1])
    .map(([c, n]) => `<span class="chip" style="border-left:3px solid ${cat(c).color}">
        ${cat(c).name} <b>${n}</b></span>`).join("")
    + `<div class="tallynote">หนึ่งเรื่องติดได้หลายหัวข้อ ผลรวมจึงมากกว่าจำนวนเรื่อง</div>`;

  pinned.forEach(r => {
    const m = L.circleMarker([r.latitude, r.longitude], {
      radius: 9, color: "#fff", weight: 2,
      fillColor: cat(main(r)).color, fillOpacity: 0.95,
    }).addTo(map);
    m.on("click", () => show(r));
    marks[r.id] = m;
  });

  if (pinned.length) {
    map.fitBounds(L.latLngBounds(pinned.map(r => [r.latitude, r.longitude])),
                  { padding: [70, 70], maxZoom: 15 });
  }

  const box = document.getElementById("nopin");
  if (!loose.length) { box.innerHTML = ""; return; }
  box.innerHTML = `
    <div class="nopin">
      <h3>ยังปักหมุดไม่ได้ ${loose.length} เรื่อง</h3>
      <p>เล่ามาแล้วแต่ไม่ได้แชร์พิกัด มีแต่ที่อยู่แบบพูด ต้องปักมือ</p>
      <ul>${loose.map(r => `<li data-id="${r.id}">
        ${esc(r.title || r.notes.slice(0, 40))}
        <div class="where">${esc(r.location_text || "ไม่ได้บอกที่อยู่ไว้เลย")}</div>
      </li>`).join("")}</ul>
    </div>`;
  box.querySelectorAll("li").forEach(li => {
    li.onclick = () => show(loose.find(r => r.id == li.dataset.id));
  });
}

function show(r) {
  const rows = [];
  const add = (label, value, cls) => {
    if (value) rows.push(`<dt>${label}</dt><dd class="${cls || ""}">${esc(value)}</dd>`);
  };

  add("เขาบอกว่าสาเหตุคือ", r.cause_said, "said");
  add("เกิดตอนไหน", r.occurred_said, "said");
  add("บ่อยแค่ไหน", FREQUENCY[r.frequency]);
  add("ช่วงเวลา", (r.time_of_day || []).map(t => TIMES[t] || t).join(" · "));
  add("เดือดร้อนยังไง", r.affect_desc);
  add("กระทบด้าน", (r.affect_tags || []).map(t => TAGS[t] || t).join(" · "));
  add("ที่อยู่ที่บอกไว้", r.location_text);
  add("บันทึกเมื่อ", new Date(r.created_at).toLocaleString("th-TH"));

  const flags = [];
  if (r.no_location) flags.push("เขาบอกเองว่าแชร์ตำแหน่งไม่ได้");
  if (r.no_photo)    flags.push("เขาบอกเองว่าถ่ายรูปไม่ได้");
  if (r.source === "rescued") flags.push("ใบนี้ระบบเก็บให้ก่อนหมดอายุ ไม่ได้ปิดเอง");

  const shots = (r.images || []).map(img => `
    <div class="shot">
      <a href="/api/dashboard/image/${img.id}" target="_blank">
        <img src="/api/dashboard/image/${img.id}" alt="">
      </a>
      <span>${esc(img.descr || "ไม่รู้ว่าคุยเรื่องอะไรอยู่ตอนส่งรูป")}</span>
    </div>`).join("");

  document.getElementById("detail").className = "card";
  document.getElementById("detail").innerHTML = `
    <span class="cat" style="background:${cat(main(r)).color}">
      ${cat(main(r)).name}${r.severity ? " · " + SEVERITY[r.severity] : ""}</span>
    ${cats(r).slice(1).map(c => `<span class="cat alt"
       style="color:${cat(c).color};box-shadow:inset 0 0 0 1px ${cat(c).color}">
       ${cat(c).name}</span>`).join("")}
    <h2>${esc(r.title || "(ไม่มีพาดหัว)")}</h2>
    <div class="notes">${esc(r.notes)}</div>
    <dl>${rows.join("")}</dl>
    ${shots ? `<div class="shots">${shots}</div>` : ""}
    ${flags.length ? `<div class="flag">${flags.map(esc).join("<br>")}</div>` : ""}`;

  document.getElementById("side").scrollTop = 0;
  if (marks[r.id]) map.setView(marks[r.id].getLatLng(), Math.max(map.getZoom(), 15));
}
</script>
</body>
</html>
